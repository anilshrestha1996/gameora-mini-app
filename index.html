<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>GAMEORA</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background:
        radial-gradient(circle at top, #18275c 0%, #080a18 55%);
      color: white;
      text-align: center;
    }

    .header {
      padding: 45px 20px 25px;
    }

    .logo-icon {
      font-size: 55px;
      margin-bottom: 5px;
    }

    h1 {
      margin: 0;
      font-size: 42px;
      letter-spacing: 3px;
      font-weight: 900;
    }

    .tagline {
      margin: 10px 0 0;
      color: #b8bfdc;
      font-size: 15px;
      letter-spacing: 1px;
    }

    .games {
      width: 100%;
      max-width: 520px;
      margin: auto;
      padding: 20px;
    }

    .game-card {
      background: rgba(22, 28, 50, 0.95);
      border: 1px solid #38436f;
      border-radius: 22px;
      padding: 28px 22px;
      margin-bottom: 20px;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.35);
    }

    .game-icon {
      font-size: 60px;
      margin-bottom: 8px;
    }

    .game-card h2 {
      margin: 8px 0;
      font-size: 27px;
    }

    .game-card p {
      color: #b9bfd3;
      line-height: 1.5;
      margin: 10px 0 20px;
    }

    .play-btn {
      display: inline-block;
      width: 100%;
      max-width: 300px;
      padding: 15px 25px;
      border: 0;
      border-radius: 14px;
      background: linear-gradient(135deg, #7b5cff, #6045df);
      color: white;
      text-decoration: none;
      font-size: 17px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 7px 20px rgba(105, 80, 230, 0.35);
    }

    .play-btn:active {
      transform: scale(0.97);
    }

    .coming {
      opacity: 0.65;
    }

    .soon-btn {
      display: inline-block;
      width: 100%;
      max-width: 300px;
      padding: 15px 25px;
      border: 0;
      border-radius: 14px;
      background: #353b55;
      color: #aaa;
      font-size: 17px;
      font-weight: 800;
    }

    .footer {
      padding: 20px;
      color: #6f7692;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <div class="header">

    <div class="logo-icon">
      🐉
    </div>

    <h1>GAMEORA</h1>

    <p class="tagline">
      DRAGON REALM • PLAY • FIGHT • WIN
    </p>

  </div>


  <div class="games">

    <!-- LUDO -->

    <div class="game-card">

      <div class="game-icon">
        🎲
      </div>

      <h2>Ludo</h2>

      <p>
        Enter the Dragon Realm and play an exciting Ludo adventure.
      </p>

      <a
        class="play-btn"
        href="https://anilshrestha1996.github.io/gameora-mini-app/ludo.html"
      >
        🎮 PLAY LUDO
      </a>

    </div>


    <!-- TEEN PATTI -->

    <div class="game-card coming">

      <div class="game-icon">
        🃏
      </div>

      <h2>Teen Patti</h2>

      <p>
        A new card game is coming soon to Gameora.
      </p>

      <div class="soon-btn">
        🔒 COMING SOON
      </div>

    </div>

  </div>


  <div class="footer">
    GAMEORA © 2026
  </div>


</body>
</html>
