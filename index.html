<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gameora</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0f1020;
  color: white;
  text-align: center;
}

.header {
  padding: 35px 20px 20px;
}

.logo {
  font-size: 48px;
  margin-bottom: 8px;
}

h1 {
  margin: 0;
  font-size: 34px;
}

.tagline {
  color: #aaa;
  margin-top: 8px;
}

.games {
  padding: 20px;
}

.game-card {
  background: #1c1d32;
  border-radius: 18px;
  padding: 22px;
  margin: 15px 0;
  border: 1px solid #30324d;
}

.game-icon {
  font-size: 50px;
}

.game-card h2 {
  margin: 10px 0;
}

.game-card p {
  color: #bbb;
}

.play-btn {
  border: none;
  border-radius: 12px;
  padding: 12px 30px;
  font-size: 16px;
  font-weight: bold;
  background: #6c5ce7;
  color: white;
}

.coming {
  opacity: 0.7;
}
</style>
</head>

<body>

<div class="header">
  <div class="logo">🎮</div>
  <h1>GAMEORA</h1>
  <p class="tagline">Play. Compete. Enjoy.</p>
</div>

<div class="games">

  <div class="game-card">
    <div class="game-icon">🎲</div>
    <h2>Ludo</h2>
    <p>Play Ludo with friends.</p>
    <button class="play-btn">PLAY</button>
  </div>

  <div class="game-card coming">
    <div class="game-icon">🧩</div>
    <h2>Teen Patti</h2>
    <p>Coming Soon</p>
    <button class="play-btn">SOON</button>
  </div>

</div>

</body>
</html>
